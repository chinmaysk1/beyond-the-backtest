# The deployed stack. Source of truth for what runs on the server.
#
# Written because the database was first brought up with a `docker run` typed
# into a terminal, which means the infrastructure existed only in a shell
# history -- the same non-reproducibility this project exists to argue against.
# If it is not in a file, it cannot be rebuilt.
#
# The host (Oracle Cloud ARM, 2 cores / 11 GB) already runs open-webui, n8n and
# discord-listener on ports 3001, 5678 and 8088. Nothing here touches those.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# The compose plugin is not installed on the box yet; `deploy/up.sh` does the
# same thing with plain `docker run` in the meantime.

name: btb

services:

  postgres:
    image: postgres:16-alpine
    container_name: btb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: btb
      POSTGRES_PASSWORD: ${BTB_DB_PASSWORD:?set BTB_DB_PASSWORD}
      POSTGRES_DB: btb
      # The server runs in UTC. Bar timestamps are epoch seconds so this is
      # belt-and-braces, but a server in local time has produced this exact
      # class of off-by-an-hour bug for everyone who has ever hit it.
      TZ: UTC
      PGTZ: UTC
    # Bound to LOCALHOST ONLY, never 0.0.0.0. The app and worker reach the
    # database over the compose network; a developer reaches it through
    # `ssh -L 55432:127.0.0.1:5432`. There is no configuration in which this
    # listens on a public interface.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btb -d btb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The Python worker. Claims backtest and sweep jobs from the `jobs` table
  # (FOR UPDATE SKIP LOCKED), and when the queue is empty refreshes any stored
  # series with a newly closed bar -- which is what keeps the data current.
  #
  # Two cores. It used to be pinned to one so open-webui stayed responsive
  # during a sweep; with Pine (PineForge) a 15m sweep on one core took ~10
  # minutes, and a sweep now splits its combinations across two sandboxed
  # processes. open-webui may lag while a long sweep runs: accepted, for sweeps
  # that finish in under five minutes. Data refresh and backtests stay
  # single-process.
  worker:
    build: ../backend
    image: btb-backend
    container_name: btb-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BTB_DB_HOST: btb-postgres
      BTB_DB_PORT: "5432"
      BTB_DB_NAME: btb
      BTB_DB_USER: btb
      BTB_DB_PASSWORD: ${BTB_DB_PASSWORD:?set BTB_DB_PASSWORD}
      TZ: UTC
    cpus: 2.0
    mem_limit: 4g
    volumes:
      - pinecache:/var/cache/btb-pine
    command: ["btb.engine", "worker", "--kinds", "backtest,sweep"]

  # The checker: answers `check` jobs only (is this Pine script acceptable,
  # what will it sweep). Separate so a long sweep never makes the Strategies
  # tab, or a user's AI calling check_pine, wait for a syntax check. Checking
  # transpiles but never compiles or runs anything.
  checker:
    image: btb-backend
    container_name: btb-checker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BTB_DB_HOST: btb-postgres
      BTB_DB_PORT: "5432"
      BTB_DB_NAME: btb
      BTB_DB_USER: btb
      BTB_DB_PASSWORD: ${BTB_DB_PASSWORD:?set BTB_DB_PASSWORD}
      TZ: UTC
    cpus: 0.5
    mem_limit: 512m
    command: ["btb.engine", "worker", "--kinds", "check", "--no-refresh", "--poll", "0.1"]

  # The web app. Reached only through Caddy; never published itself.
  web:
    build: ../web
    image: btb-web
    container_name: btb-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://btb:${BTB_DB_PASSWORD:?set BTB_DB_PASSWORD}@btb-postgres:5432/btb
      SESSION_SECRET: ${BTB_SESSION_SECRET:?set BTB_SESSION_SECRET (32+ characters)}
      BTB_PUBLIC_URL: https://${BTB_DOMAIN:?set BTB_DOMAIN}
      TZ: UTC
    cpus: 0.75
    mem_limit: 1g

  # TLS and the only public ports. Certificates live in the caddy volumes so a
  # restart does not re-request them.
  caddy:
    image: caddy:2.8-alpine
    container_name: btb-caddy
    restart: unless-stopped
    depends_on:
      - web
    environment:
      BTB_DOMAIN: ${BTB_DOMAIN:?set BTB_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
    name: btb_pgdata
  pinecache:
    name: btb_pinecache
  caddy_data:
    name: btb_caddy_data
  caddy_config:
    name: btb_caddy_config
